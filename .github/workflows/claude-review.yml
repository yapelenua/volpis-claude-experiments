name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  review:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && 
       contains(github.event.comment.body, '@claude') &&
       github.event.comment.user.type != 'Bot')
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: "--allowedTools Bash,Read,Write,Edit"
          prompt: |
            You are reviewing GitHub PR #${{ github.event.pull_request.number }} in repo ${{ github.repository }}.
            
            Run these commands to get the diff:
            - gh pr diff ${{ github.event.pull_request.number }}
            - gh pr view ${{ github.event.pull_request.number }}
            
            Read CLAUDE.md for project conventions.
            Post inline comments on specific lines where rules are violated.
            Always post a summary comment using: gh pr comment ${{ github.event.pull_request.number }} --body "..."
            Even if no issues found, write: "✅ Code review passed. No issues found."